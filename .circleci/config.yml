version: 2.1
orbs:
  go: circleci/go@3.0.2

jobs:
  build_and_test:
    executor:
      name: go/default
      tag: '1.20'
    steps:
      - checkout
      - go/mod-download
      - go/test
      - persist_to_workspace:
        root: ~/project
        paths: .

workflows:
  build_test:
    jobs:
      - build_and_test
